<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <img src="img/raphael.jpeg" alt="Minha fotografia" class="foto">

            <h2>Cadastro Pessoal</h2>

        <form id="formulario">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco" name="endereco" placeholder="Digite seu endereço" required>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="seuemail@email.com" required>

            <label for="nacionalidade">Nacionalidade:</label>
            <input type="text" id="nacionalidade" name="nacionalidade" placeholder="Ex: Brasileira" required>

            <label for="naturalidade">Naturalidade:</label>
            <input type="text" id="naturalidade" name="naturalidade" placeholder="Ex: São Paulo - SP" required>

            <div class="button-container">
                <button type="submit" id="enviar">Enviar Cadastro</button>
                <button type="button" id="limpar" onclick="limparFormulario()">Limpar</button>
            </div>
        </form>

        <div id="mensagem"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
